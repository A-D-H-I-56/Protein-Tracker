version: '3.8'

services:
  nutri-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutri_ai_production
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./artifacts:/app/artifacts
      - ./Fitness_data.csv:/app/Fitness_data.csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
