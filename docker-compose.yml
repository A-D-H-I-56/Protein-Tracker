version: '3.8'

services:
  nutri-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutri_ai_production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-random-secret-key-change-me
      - HOST=0.0.0.0
      - PORT=5000
      - THREADS=4
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
